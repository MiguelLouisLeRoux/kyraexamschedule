<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invigilation Hub (Offline Standalone)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      line-height: 1.5;
    }
    .header {
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      padding: 12px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .logo-area { display: flex; items-center: center; gap: 10px; }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 9999px;
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
    }
    .hero-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 16px 20px;
    }
    @media (max-width: 640px) { .hero-tabs { grid-template-columns: 1fr; } }
    .hero-btn {
      padding: 16px;
      border-radius: 16px;
      border: 2px solid #e2e8f0;
      background: #ffffff;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
    }
    .hero-btn.active-blue {
      background: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
      box-shadow: 0 10px 15px -3px rgba(37,99,235,0.25);
    }
    .hero-btn.active-indigo {
      background: #4f46e5;
      color: #ffffff;
      border-color: #4f46e5;
      box-shadow: 0 10px 15px -3px rgba(79,70,229,0.25);
    }
    .hero-btn h3 { font-size: 18px; font-weight: 900; }
    .hero-btn p { font-size: 12px; opacity: 0.9; margin-top: 2px; }
    .panel {
      background: #ffffff;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      margin: 0 20px 20px 20px;
      padding: 16px;
    }
    .controls-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    select, input {
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      background: #f8fafc;
      color: #0f172a;
    }
    select:focus, input:focus {
      outline: none;
      border-color: #2563eb;
      background: #ffffff;
    }
    .btn {
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .btn-dark { background: #0f172a; color: #ffffff; }
    .btn-dark:hover { background: #1e293b; }
    .btn-amber { background: #f59e0b; color: #ffffff; }
    .btn-amber:hover { background: #d97706; }
    .btn-red { background: #ef4444; color: #ffffff; }
    .btn-red:hover { background: #dc2626; }
    .btn-emerald { background: #10b981; color: #ffffff; }
    .btn-emerald:hover { background: #059669; }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13px;
    }
    th {
      background: #f1f5f9;
      padding: 10px 12px;
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 800;
      color: #475569;
      border-bottom: 2px solid #e2e8f0;
    }
    td {
      padding: 10px 12px;
      border-bottom: 1px solid #f1f5f9;
      color: #1e293b;
    }
    tr:hover td { background: #f8fafc; }
    .role-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
    }
    .role-Invigilator { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
    .role-Relief { background: #fffbeb; color: #b45309; border-color: #fde68a; }
    .role-Runner { background: #faf5ff; color: #7e22ce; border-color: #e9d5ff; }
    .role-IT { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
    .role-Non-Writing { background: #f1f5f9; color: #475569; border-color: #cbd5e1; }
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal {
      background: #ffffff;
      border-radius: 20px;
      max-width: 800px;
      width: 100%;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8fafc;
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      flex: 1;
    }
    @media print {
      .no-print { display: none !important; }
      body { background: #fff; font-size: 11pt; }
      .panel { border: none; margin: 0; padding: 0; }
      table { border-collapse: collapse; width: 100%; }
      th, td { border: 1px solid #cbd5e1 !important; padding: 6px 8px !important; }
      th { background-color: #f1f5f9 !important; }
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <div class="header no-print">
    <div class="logo-area">
      <h2 style="font-weight: 900; font-size: 18px;">Invigilation Hub</h2>
      <span class="badge">Standalone Offline App (Data Embedded)</span>
    </div>
    <div style="display: flex; gap: 8px;">
      <button class="btn btn-dark" onclick="window.print()">Print Timetable</button>
    </div>
  </div>

  <!-- Big View Switcher Buttons -->
  <div class="hero-tabs no-print">
    <button id="btnTeacherView" class="hero-btn active-blue" onclick="switchView('teacher')">
      <h3>TEACHER VIEW</h3>
      <p>Select educator to view their complete timetable</p>
    </button>
    <button id="btnSessionView" class="hero-btn" onclick="switchView('session')">
      <h3>SESSION VIEW</h3>
      <p>Select date or all dates with invigilators on the left</p>
    </button>
  </div>

  <!-- Teacher View Container -->
  <div id="teacherViewContainer" class="panel">
    <div class="controls-row no-print">
      <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center;">
        <div>
          <label style="display:block; font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase;">Select Educator</label>
          <select id="teacherSelect" onchange="renderTeacherView()"></select>
        </div>
        <div>
          <label style="display:block; font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase;">Choose Date</label>
          <select id="teacherDateSelect" onchange="renderTeacherView()">
            <option value="ALL">All Dates (Full Schedule)</option>
          </select>
        </div>
      </div>
      <div>
        <button class="btn btn-dark" onclick="window.print()">Print My Slip</button>
      </div>
    </div>

    <div style="overflow-x: auto;">
      <table id="teacherTable">
        <thead>
          <tr>
            <th>Date & Day</th>
            <th>Session & Time</th>
            <th>Venue</th>
            <th>Subject</th>
            <th>Paper</th>
            <th>Grade</th>
            <th>Learners</th>
            <th>Role</th>
          </tr>
        </thead>
        <tbody id="teacherTableBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Session View Container -->
  <div id="sessionViewContainer" class="panel" style="display: none;">
    <div class="controls-row no-print">
      <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center;">
        <div>
          <label style="display:block; font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase;">Choose Date</label>
          <select id="sessionDateSelect" onchange="renderSessionView()">
            <option value="ALL">All Dates (Full Examination Schedule)</option>
          </select>
        </div>
        <div>
          <label style="display:block; font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase;">Grade Filter</label>
          <select id="sessionGradeSelect" onchange="renderSessionView()">
            <option value="ALL">All Grades (Full Day)</option>
          </select>
        </div>
        <div>
          <label style="display:block; font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase;">Search Room / Invigilator</label>
          <input type="text" id="sessionSearchInput" placeholder="Filter by room, name..." oninput="renderSessionView()" />
        </div>
      </div>

      <div style="display: flex; flex-wrap: wrap; gap: 8px;">
        <button class="btn btn-amber" onclick="openUnallocatedModal()">Who is Not Allocated?</button>
        <button class="btn btn-dark" onclick="window.print()">Print Roster</button>
      </div>
    </div>

    <div style="overflow-x: auto;">
      <table id="sessionTable">
        <thead>
          <tr>
            <th>Invigilator Name</th>
            <th id="thSessionDate">Date</th>
            <th>Session & Time</th>
            <th>Room / Venue</th>
            <th>Subject</th>
            <th>Paper</th>
            <th>Grade</th>
            <th>Learners</th>
            <th>Role</th>
          </tr>
        </thead>
        <tbody id="sessionTableBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Unallocated Modal -->
  <div id="unallocatedModal" class="modal-backdrop">
    <div class="modal">
      <div class="modal-header">
        <h3 style="font-weight: 800; font-size: 16px;">Who is Not Allocated for the Session?</h3>
        <button class="btn" onclick="closeModal('unallocatedModal')">&times;</button>
      </div>
      <div class="modal-body">
        <div style="display: flex; gap: 12px; margin-bottom: 12px;">
          <div>
            <label style="font-size: 11px; font-weight: 700;">Date:</label>
            <select id="unallocatedDateSelect" onchange="renderUnallocatedList()"></select>
          </div>
          <div>
            <label style="font-size: 11px; font-weight: 700;">Session:</label>
            <select id="unallocatedSessionSelect" onchange="renderUnallocatedList()">
              <option value="Morning">Morning</option>
              <option value="Afternoon">Afternoon</option>
            </select>
          </div>
        </div>
        <table>
          <thead>
            <tr>
              <th>Staff Member</th>
              <th>Status for Today</th>
              <th>Duty in Other Session</th>
            </tr>
          </thead>
          <tbody id="unallocatedTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

    const uniqueTeachers = Array.from(new Set(RECORDS.map(r => r.teacherName))).sort();
    const uniqueDates = Array.from(new Set(RECORDS.map(r => r.date))).filter(Boolean).sort();

    function init() {
      // Populate teacher select
      const tSelect = document.getElementById('teacherSelect');
      uniqueTeachers.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t;
        opt.textContent = t;
        tSelect.appendChild(opt);
      });

      // Populate session date select
      const sDateSelect = document.getElementById('sessionDateSelect');
      const uDateSelect = document.getElementById('unallocatedDateSelect');

      uniqueDates.forEach(d => {
        const opt1 = document.createElement('option');
        opt1.value = d;
        opt1.textContent = d;
        sDateSelect.appendChild(opt1);

        const opt2 = document.createElement('option');
        opt2.value = d;
        opt2.textContent = d;
        uDateSelect.appendChild(opt2);
      });

      renderTeacherView();
      renderSessionView();
    }

    function switchView(view) {
      const btnT = document.getElementById('btnTeacherView');
      const btnS = document.getElementById('btnSessionView');
      const conT = document.getElementById('teacherViewContainer');
      const conS = document.getElementById('sessionViewContainer');

      if (view === 'teacher') {
        btnT.className = 'hero-btn active-blue';
        btnS.className = 'hero-btn';
        conT.style.display = 'block';
        conS.style.display = 'none';
      } else {
        btnT.className = 'hero-btn';
        btnS.className = 'hero-btn active-indigo';
        conT.style.display = 'none';
        conS.style.display = 'block';
      }
    }

    function renderTeacherView() {
      const teacher = document.getElementById('teacherSelect').value;
      const dateFilter = document.getElementById('teacherDateSelect').value;
      const tbody = document.getElementById('teacherTableBody');
      tbody.innerHTML = '';

      // Populate teacher's specific dates dropdown if needed
      const tDateSelect = document.getElementById('teacherDateSelect');
      const currentSelected = tDateSelect.value;
      const tDuties = RECORDS.filter(r => r.teacherName === teacher);
      const tDates = Array.from(new Set(tDuties.map(r => r.date))).sort();

      tDateSelect.innerHTML = '<option value="ALL">All Dates (Full Schedule)</option>';
      tDates.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d;
        opt.textContent = d;
        if (d === currentSelected) opt.selected = true;
        tDateSelect.appendChild(opt);
      });

      const duties = tDuties.filter(r => dateFilter === 'ALL' || r.date === dateFilter);

      duties.forEach(d => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${d.date}</strong></td>
          <td>${d.sessionTiming} ${d.startTime ? '('+d.startTime+')' : ''}</td>
          <td><strong>${d.venue || '—'}</strong></td>
          <td>${d.subject || 'Non-writing'}</td>
          <td>${d.paper ? '<strong>'+d.paper+'</strong>' : '—'}</td>
          <td>${d.grade || '—'}</td>
          <td>${d.totalLearners || '—'}</td>
          <td><span class="role-badge role-${(d.roleNormalized || 'Other').replace(/\s+/g, '')}">${d.roleNormalized || d.role}</span></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function renderSessionView() {
      const date = document.getElementById('sessionDateSelect').value;
      const gradeSelect = document.getElementById('sessionGradeSelect');
      const selectedGrade = gradeSelect.value || 'ALL';
      const query = (document.getElementById('sessionSearchInput').value || '').toLowerCase().trim();
      const tbody = document.getElementById('sessionTableBody');
      const thDate = document.getElementById('thSessionDate');
      tbody.innerHTML = '';

      const isAll = date === 'ALL';
      thDate.style.display = isAll ? '' : 'none';

      let baseDuties = isAll ? RECORDS : RECORDS.filter(r => r.date === date);

      // Populate available grades for this date
      const availableGrades = Array.from(new Set(baseDuties.map(r => (r.grade || '').trim()).filter(Boolean))).sort((a,b) => {
        const numA = parseInt(a, 10);
        const numB = parseInt(b, 10);
        if (!isNaN(numA) && !isNaN(numB)) return numA - numB;
        return a.localeCompare(b);
      });

      gradeSelect.innerHTML = '<option value="ALL">All Grades (Full Day)</option>';
      availableGrades.forEach(g => {
        const opt = document.createElement('option');
        opt.value = g;
        opt.textContent = 'Grade ' + g + ' Only';
        if (g === selectedGrade) opt.selected = true;
        gradeSelect.appendChild(opt);
      });

      const currentGrade = gradeSelect.value;
      let duties = currentGrade === 'ALL' ? baseDuties : baseDuties.filter(r => (r.grade || '').trim() === currentGrade);

      if (query) {
        duties = duties.filter(d => 
          (d.teacherName && d.teacherName.toLowerCase().includes(query)) ||
          (d.venue && d.venue.toLowerCase().includes(query)) ||
          (d.subject && d.subject.toLowerCase().includes(query)) ||
          (d.grade && d.grade.toLowerCase().includes(query)) ||
          (d.paper && d.paper.toLowerCase().includes(query))
        );
      }

      duties.sort((a,b) => a.teacherName.localeCompare(b.teacherName));

      duties.forEach(d => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${d.teacherName}</strong></td>
          ${isAll ? '<td>'+d.date+'</td>' : ''}
          <td>${d.sessionTiming} ${d.startTime ? '('+d.startTime+')' : ''}</td>
          <td><strong>${d.venue || '—'}</strong></td>
          <td>${d.subject || 'Non-writing'}</td>
          <td>${d.paper ? '<strong>'+d.paper+'</strong>' : '—'}</td>
          <td>${d.grade || '—'}</td>
          <td>${d.totalLearners || '—'}</td>
          <td><span class="role-badge role-${(d.roleNormalized || 'Other').replace(/\s+/g, '')}">${d.roleNormalized || d.role}</span></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function openUnallocatedModal() {
      const sDate = document.getElementById('sessionDateSelect').value;
      if (sDate !== 'ALL') {
        document.getElementById('unallocatedDateSelect').value = sDate;
      }
      document.getElementById('unallocatedModal').style.display = 'flex';
      renderUnallocatedList();
    }

    function renderUnallocatedList() {
      const date = document.getElementById('unallocatedDateSelect').value;
      const session = document.getElementById('unallocatedSessionSelect').value;
      const otherSession = session === 'Morning' ? 'Afternoon' : 'Morning';
      const tbody = document.getElementById('unallocatedTableBody');
      tbody.innerHTML = '';

      const dayDuties = RECORDS.filter(r => r.date === date);
      const allocatedInTarget = new Set(dayDuties.filter(r => r.sessionTiming.toLowerCase() === session.toLowerCase()).map(r => r.teacherName.toLowerCase()));
      const otherDutiesMap = {};
      dayDuties.filter(r => r.sessionTiming.toLowerCase() !== session.toLowerCase()).forEach(r => {
        const k = r.teacherName.toLowerCase();
        if (!otherDutiesMap[k]) otherDutiesMap[k] = [];
        otherDutiesMap[k].push(r);
      });

      uniqueTeachers.forEach(t => {
        const lower = t.toLowerCase();
        if (!allocatedInTarget.has(lower)) {
          const others = otherDutiesMap[lower];
          const hasOther = others && others.length > 0;
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><strong>${t}</strong></td>
            <td>${hasOther ? '<span style="color:#b45309;font-weight:700;">⚠️ On in '+otherSession+'</span>' : '<span style="color:#047857;font-weight:700;">✅ Free All Day</span>'}</td>
            <td>${hasOther ? others.map(o => o.subject + ' (' + (o.paper || '') + ') in ' + (o.venue || 'Venue') + ' [' + o.sessionTiming + ']').join(', ') : '—'}</td>
          `;
          tbody.appendChild(tr);
        }
      });
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    window.onload = init;
  </script>
